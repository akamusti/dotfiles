monitor=,preferred,auto,1

env = LIBVA_DRIVER_NAME,nvidia
env = __GLX_VENDOR_LIBRARY_NAME,nvidia
env = XDG_SESSION_TYPE,wayland
env = XDG_CURRENT_DESKTOP,Hyprland
env = QT_QPA_PLATFORM,wayland
env = QT_WAYLAND_DISABLE_WINDOWDECORATION,1
env = SDL_VIDEODRIVER,wayland

cursor { no_hardware_cursors = true }

# NVIDIA (proprietary surucu) ince ayarlari
opengl { nvidia_anti_flicker = 0 }
render { explicit_sync = 1 }

exec-once = hyprpaper
exec-once = waybar
exec-once = swaync
exec-once = /usr/libexec/polkit-kde-authentication-agent-1
exec-once = nm-applet --indicator &
exec-once = wl-paste --watch cliphist store &

input {
    kb_layout = tr,us
    kb_options = grp:alt_shift_toggle
    follow_mouse = 1
}

general {
    gaps_in = 6
    gaps_out = 14
    border_size = 2
    col.active_border = rgb(cba6f7) rgb(89b4fa) 45deg
    col.inactive_border = rgb(313244)
    layout = dwindle
}

decoration {
    rounding = 12
    active_opacity = 1.0
    inactive_opacity = 0.93
}

misc { background_color = rgb(1e1e2e); disable_hyprland_logo = true }

animations {
    enabled = yes
    bezier = myBezier, 0.05, 0.9, 0.1, 1.05
    animation = windows, 1, 6, myBezier
    animation = workspaces, 1, 6, myBezier
    animation = fade, 1, 5, default
    animation = border, 1, 8, default
}

$mainMod = SUPER
bind = $mainMod, Return, exec, kitty
bind = $mainMod, T, exec, kitty
bind = ALT, Return, exec, kitty
bind = $mainMod, D, exec, pkill wofi || wofi --show drun
bind = $mainMod, Space, exec, pkill wofi || wofi --show drun
bind = $mainMod, Q, killactive,
bind = $mainMod SHIFT, M, exit,
bind = $mainMod, F, fullscreen,
bind = $mainMod, V, togglefloating,
bind = $mainMod, left, movefocus, l
bind = $mainMod, right, movefocus, r
bind = $mainMod, up, movefocus, u
bind = $mainMod, down, movefocus, d
bind = $mainMod, 1, workspace, 1
bind = $mainMod, 2, workspace, 2
bind = $mainMod, 3, workspace, 3
bind = $mainMod, 4, workspace, 4
bind = $mainMod, 5, workspace, 5
bind = $mainMod SHIFT, 1, movetoworkspace, 1
bind = $mainMod SHIFT, 2, movetoworkspace, 2
bind = $mainMod SHIFT, 3, movetoworkspace, 3
bind = $mainMod SHIFT, 4, movetoworkspace, 4
bind = $mainMod SHIFT, 5, movetoworkspace, 5
exec-once = hypridle
exec-once = blueman-applet &
bind = $mainMod, L, exec, hyprlock
# Ekran goruntusu: bolge duzenle / bolge panoya / pencere panoya / tam ekran dosyaya
bind = , Print, exec, hyprshot -m region --raw | swappy -f -
bind = SHIFT, Print, exec, hyprshot -m region --clipboard
bind = $mainMod, Print, exec, hyprshot -m window --clipboard
bind = $mainMod SHIFT, Print, exec, mkdir -p ~/Pictures && grim ~/Pictures/screenshot-$(date +%F-%H%M%S).png

# HyprMod managed settings
source = ~/.config/hypr/hyprland-gui.conf
bindl = , XF86AudioMute, exec, sh -c 'wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle; V=$(wpctl get-volume @DEFAULT_AUDIO_SINK@); echo "$V" | grep -q MUTED && notify-send -a OSD -r 9991 -t 1500 "Ses kapali" || notify-send -a OSD -r 9991 -t 1500 -h int:value:$(echo "$V" | awk "{print int($2*100)}") "Ses"'
bindl = , XF86AudioLowerVolume, exec, sh -c 'wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-; notify-send -a OSD -r 9991 -t 1500 -h int:value:$(wpctl get-volume @DEFAULT_AUDIO_SINK@ | awk "{print int($2*100)}") "Ses"'
bindl = , XF86AudioRaiseVolume, exec, sh -c 'wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%+; notify-send -a OSD -r 9991 -t 1500 -h int:value:$(wpctl get-volume @DEFAULT_AUDIO_SINK@ | awk "{print int($2*100)}") "Ses"'
bindl = , XF86MonBrightnessDown, exec, sh -c 'brightnessctl set 5%-; notify-send -a OSD -r 9992 -t 1500 -h int:value:$(brightnessctl -m | cut -d, -f4 | tr -d %) "Parlaklik"'
bindl = , XF86MonBrightnessUp, exec, sh -c 'brightnessctl set 5%+; notify-send -a OSD -r 9992 -t 1500 -h int:value:$(brightnessctl -m | cut -d, -f4 | tr -d %) "Parlaklik"'

# ---- Laptop Fn+F1..F12 (Fn OS'e modifier olarak gorunmez, cekirdek XF86 uretir) ----
# Ses: genelde Fn+F1/F2/F3 zaten yukarida, mic: genelde Fn+F4
bindl = , XF86AudioMicMute, exec, sh ~/.config/hypr/fn-osd.sh mic
# Klavye isigi (XF86Kbd*): genelde Fn+F7/F8
bindl = , XF86KbdBrightnessDown, exec, sh ~/.config/hypr/fn-osd.sh kbd-down
bindl = , XF86KbdBrightnessUp, exec, sh ~/.config/hypr/fn-osd.sh kbd-up
bindl = , XF86KbdLightOnOff, exec, sh ~/.config/hypr/fn-osd.sh kbd-toggle
# Medya: genelde Fn+F9/F10/F11/F12
bindl = , XF86AudioPlay, exec, sh ~/.config/hypr/fn-osd.sh play
bindl = , XF86AudioPause, exec, sh ~/.config/hypr/fn-osd.sh play
bindl = , XF86AudioNext, exec, sh ~/.config/hypr/fn-osd.sh next
bindl = , XF86AudioPrev, exec, sh ~/.config/hypr/fn-osd.sh prev
bindl = , XF86AudioStop, exec, sh ~/.config/hypr/fn-osd.sh stop
bindl = , XF86AudioRewind, exec, sh ~/.config/hypr/fn-osd.sh prev
bindl = , XF86AudioForward, exec, sh ~/.config/hypr/fn-osd.sh next
# Kablosuz / ucak modu / bluetooth (genelde Fn+F8)
bindl = , XF86WLAN, exec, sh ~/.config/hypr/fn-osd.sh wifi
bindl = , XF86RFKill, exec, sh ~/.config/hypr/fn-osd.sh airplane
bindl = , XF86UWB, exec, sh ~/.config/hypr/fn-osd.sh airplane
bindl = , XF86Bluetooth, exec, sh ~/.config/hypr/fn-osd.sh bluetooth
# Touchpad (genelde Fn+F9)
bindl = , XF86TouchpadToggle, exec, sh ~/.config/hypr/fn-osd.sh touchpad
bindl = , XF86TouchpadOn, exec, sh ~/.config/hypr/fn-osd.sh touchpad
bindl = , XF86TouchpadOff, exec, sh ~/.config/hypr/fn-osd.sh touchpad
# Ekran cikisi / projeksiyon (genelde Fn+F7)
bindl = , XF86Display, exec, sh ~/.config/hypr/fn-osd.sh display
bindl = , XF86DisplayOff, exec, hyprctl dispatch dpms off
# Webcam / hesap makinesi / dosya yoneticisi / tarayici / mail / arama
bindl = , XF86WebCam, exec, sh ~/.config/hypr/fn-osd.sh webcam
bindl = , XF86Calculator, exec, sh ~/.config/hypr/fn-osd.sh calc
bindl = , XF86Explorer, exec, sh ~/.config/hypr/fn-osd.sh explorer
bindl = , XF86HomePage, exec, sh ~/.config/hypr/fn-osd.sh explorer
bindl = , XF86MyComputer, exec, sh ~/.config/hypr/fn-osd.sh explorer
bindl = , XF86WWW, exec, sh ~/.config/hypr/fn-osd.sh browser
bindl = , XF86Mail, exec, sh ~/.config/hypr/fn-osd.sh mail
bindl = , XF86Search, exec, sh ~/.config/hypr/fn-osd.sh search
# Kilit / uyku / guc / pil
bindl = , XF86ScreenSaver, exec, sh ~/.config/hypr/fn-osd.sh lock
bindl = , XF86Sleep, exec, sh ~/.config/hypr/fn-osd.sh sleep
bindl = , XF86Suspend, exec, sh ~/.config/hypr/fn-osd.sh sleep
bindl = , XF86Hibernate, exec, sh ~/.config/hypr/fn-osd.sh hibernate
bindl = , XF86PowerOff, exec, sh ~/.config/hypr/fn-osd.sh power
bindl = , XF86Battery, exec, sh ~/.config/hypr/fn-osd.sh battery

# ---- Bas-konus (Discord PTT fix) ----
# Wayland'da Discord odak disiyken global tusu goremez. Cozum: mic'i sistem
# seviyesinde ac/kapa. Discord'u "Ses Etkinligi" moduna al, Discord ici PTT
# tusunu kaldir (yoksa Discord sesi yine keser).
# Tusu degistirmek icin asagidaki iki satirda ALT_L yerine istedigini yaz
# (ornek: Caps_Lock, Control_R, mouse:275). Sag ALT (AltGr) TR klavyede
# karakter yazdigi icin bilerek atanmadi.
exec-once = wpctl set-mute @DEFAULT_AUDIO_SOURCE@ 1
bind = , ALT_L, exec, sh ~/.config/hypr/fn-osd.sh ptt-on
bindr = , ALT_L, exec, sh ~/.config/hypr/fn-osd.sh ptt-off
bind = ALT, Space, exec, pkill wofi || wofi --show drun
bind = ALT, Q, killactive,
bind = $mainMod, X, exec, pkill wofi || ~/.config/wofi/powermenu.sh
bind = $mainMod SHIFT, V, exec, cliphist list | wofi --dmenu --prompt "Pano" | cliphist decode | wl-copy
